<!DOCTYPE html>
<html lang="is">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Icons (iconfont)</title>
    <link href="/assets/favicon.png" rel="shortcut icon" />
    <link
      rel="stylesheet"
      href="/bundle/v0.8?m=-basics,Layout,PageHeading,TextBlock,Icon"
    />
    <link rel="stylesheet" href="/assets/ThumbnailGrid.css" />
    <style>
      .IconExample {
        height: 4rem;
        line-height: 4rem;
      }
      .
    </style>
  </head>

  <body>
    <div class="Layout">
      <div class="Layout__content">
        <div class="Layout__header">
          <a class="Layout__header__logo" href="/">
            <picture>
              <img src="/assets/reykjavik-logo.svg" alt="" loading="lazy" />
            </picture>
            Reykjavík
          </a>
        </div>
        <div class="Layout__main">
          <h1 class="PageHeading">Icons</h1>
          <div class="TextBlock">
            <a href="iconfont.json">iconfont.json</a>
          </div>

          <hr />

          <div class="TextBlock">
            <h2>Legacy Iconfont</h2>
            <a href="icons.json">icons.json</a>
          </div>
        </div>
      </div>
    </div>

    <script type="module">
      if (document.location.hostname === 'localhost') {
        const cssLink = document.querySelector(
          'link[rel="stylesheet"][href^="/bundle/"]'
        );
        cssLink.setAttribute(
          'href',
          cssLink.getAttribute('href').replace(/\/bundle\/.+?\?/, '/bundle/dev?')
        );
      }

      const mainElm = document.querySelector('.Layout__main');
      const links = mainElm.querySelectorAll('a[href$=".json"]');

      const getEntries = {
        'icons.json': (icons) => Object.entries(icons),
        'iconfont.json': (icons) => icons.map((icon) => [icon, icon]),
      };

      links.forEach((linkElm) => {
        const href = linkElm.getAttribute('href');
        const isLegacy = href === 'icons.json';

        fetch(linkElm.href)
          .then((res) => {
            if (!res.ok) {
              throw new Error('Not Found');
            }
            return res.json();
          })
          .then((icons) => {
            linkElm.parentNode.insertAdjacentHTML(
              'afterend',
              `
							<ul class="ThumbnailGrid ThumbnailGrid--small">
								${getEntries[href](icons)
                  .map(
                    ([name, value]) => `
										<li class="ThumbnailGrid__item">
											<span
                        class="Icon IconExample"
                        data-icon-size="large"
                        data-icon="${isLegacy ? '' : value}"
                        ${isLegacy ? `style="--Icon: '${value}';"` : ''}
                      ></span>
											<strong class="ThumbnailGrid__label">${name}</strong>
										</li>
									`
                  )
                  .join('')}
							</ul>
						`
            );
          })
          .catch((e) => {
            linkElm.parentNode.insertAdjacentHTML(
              'afterend',
              `
							<p>
                <strong>Eeek!</strong><br />
                ${e.message}
              </p>
						`
            );
          });
      });
    </script>
  </body>
</html>
